; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41, nano33ble

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -D USB_MIDI_SERIAL
monitor_speed = 115200
build_src_filter =
    -<*>
    +<main.cpp>
    +<ControlAlgorithm.cpp>
    +<commProtocol.cpp>

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<nanoBridge.cpp>
    +<commProtocol.cpp>
lib_deps =
    arduino-libraries/ArduinoBLE @ 1.3.7

; Opt-in communication demo. These images never enable the motor.
[env:teensy41_packet_demo]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -D PACKET_DEMO_TEENSY
build_src_filter =
    -<*>
    +<packetDemo.cpp>
    +<commProtocol.cpp>

[env:nano33ble_packet_demo]
extends = env:nano33ble
build_flags = -D PACKET_DEMO_NANO
build_src_filter =
    -<*>
    +<packetDemo.cpp>
    +<commProtocol.cpp>

; BLE-only trial: BeagleBone -> Nano -> BeagleBone; no Teensy required.
[env:nano33ble_packet_loopback]
extends = env:nano33ble_packet_demo
build_flags = -D PACKET_DEMO_NANO -D PACKET_DEMO_LOOPBACK
